services:
  # Dịch vụ Backend của đồng nghiệp
  backend:
    build: 
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: stock-gnn-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow

  # Dịch vụ MLflow đã được MLOps (Bạn) tối ưu hóa
  mlflow:
    build:
      context: .
      dockerfile: ./mlops/Dockerfile
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow_data
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////mlflow_data/mlflow.db
    command: >
      mlflow server 
      --backend-store-uri sqlite:////mlflow_data/mlflow.db 
      --default-artifact-root /mlflow_data/artifacts 
      --host 0.0.0.0 
      --port 5000
    restart: always
